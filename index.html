<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">

<div class="container">
 <div class="topo">
  <h1>💰 Controle Financeiro</h1>
  <button onclick="logout()" class="logout">Sair</button>
</div>

  <div class="resumo">
    <div class="card receita">
      <h3>Receitas</h3>
      <p id="totalReceitas">R$ 0</p>
    </div>

    <div class="card despesa">
      <h3>Despesas</h3>
      <p id="totalDespesas">R$ 0</p>
    </div>

    <div class="card saldo">
      <h3>Saldo</h3>
      <p id="saldo">R$ 0</p>
    </div>
  </div>

  <div class="form">
    <input type="text" id="descricao" placeholder="Descrição">
    <input type="number" id="valor" placeholder="Valor">

    <div class="tipo">
    <button id="btnReceita" onclick="selecionarTipo('receita')">💰 Receita</button>
    <button id="btnDespesa" onclick="selecionarTipo('despesa')">💸 Despesa</button>
    </div>
    <button onclick="adicionar()">Adicionar</button>
  </div>

  <ul id="lista"></ul>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
